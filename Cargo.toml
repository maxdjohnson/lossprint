[package]
name = "lossprint"
version = "1.1.0"
edition = "2021"
rust-version = "1.97"
description = "Detect lossy transcodes hiding in lossless audio collections"
license = "MIT"
readme = "README.md"
repository = "https://github.com/maxdjohnson/lossprint"
homepage = "https://github.com/maxdjohnson/lossprint"
documentation = "https://docs.rs/lossprint"
keywords = ["audio", "lossless", "transcode", "detection", "onnx"]
categories = ["multimedia::audio", "command-line-utilities"]
publish = ["crates-io"]
include = [
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/THIRD_PARTY.md",
    "/build.rs",
    "/examples/**",
    "/model/model.onnx",
    "/rust-toolchain.toml",
    "/src/**",
    "/tests/*.py",
    "/tests/*.rs",
    "/tests/fixtures/audio/*.aiff",
    "/tests/fixtures/audio/*.flac",
    "/tests/fixtures/audio/*.md",
    "/tests/fixtures/audio/*.wav",
]

[features]
default = []
cli = [
    "dep:anyhow",
    "dep:clap",
    "dep:rayon",
    "dep:serde",
    "dep:serde_json",
    "dep:walkdir",
]

[[bin]]
name = "lossprint"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
rayon = { version = "1.12", optional = true }
rustfft = "6.4"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
symphonia = { version = "0.6.1", default-features = false, features = ["aiff", "flac", "pcm", "wav"] }
thiserror = "2.0"
tract-onnx = { version = "0.23.4", default-features = false }
walkdir = { version = "2.5", optional = true }

[build-dependencies]
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
