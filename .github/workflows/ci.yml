name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo test --locked

  build:
    name: Build and integration test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: Package Unix release artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          base="lossprint-${TARGET}"
          release_prefix=""
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            release_prefix="${GITHUB_REF_NAME}-"
          fi
          archive="dist/lossprint-${release_prefix}${TARGET}.tar.gz"
          mkdir -p "dist/${base}"
          install -m 755 "target/${TARGET}/release/lossprint" "dist/${base}/lossprint"
          install -m 644 README.md LICENSE THIRD_PARTY.md "dist/${base}/"
          tar -C dist -czf "${archive}" "${base}"
          echo "ARCHIVE_PATH=${archive}" >> "${GITHUB_ENV}"
      - name: Package Windows release artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "lossprint-$env:TARGET"
          $releasePrefix = ""
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $releasePrefix = "$env:GITHUB_REF_NAME-"
          }
          $archive = "dist/lossprint-$releasePrefix$env:TARGET.zip"
          $stage = "dist/$base"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$env:TARGET/release/lossprint.exe" "$stage/lossprint.exe"
          Copy-Item "target/$env:TARGET/release/DirectML.dll" "$stage/DirectML.dll"
          Copy-Item README.md, LICENSE, THIRD_PARTY.md -Destination $stage
          Copy-Item licenses/windows/DirectML_LICENSE.txt, licenses/windows/DirectML_ThirdPartyNotices.txt -Destination $stage
          Compress-Archive -LiteralPath $stage -DestinationPath $archive
          "ARCHIVE_PATH=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Extract packaged Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir smoke
          tar -xzf "${ARCHIVE_PATH}" -C smoke
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lossprint") | .version')"
          "smoke/lossprint-${TARGET}/lossprint" --version | grep -Fx "lossprint ${version}"
      - name: Extract packaged Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive -LiteralPath $env:ARCHIVE_PATH -DestinationPath smoke
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "cargo metadata failed with exit code $LASTEXITCODE"
          }
          $version = ($metadata.packages | Where-Object name -eq "lossprint").version
          $runtime = "smoke/lossprint-$env:TARGET/DirectML.dll"
          if (-not (Test-Path -LiteralPath $runtime -PathType Leaf)) {
            throw "packaged artifact is missing DirectML.dll"
          }
          $actual = & "smoke/lossprint-$env:TARGET/lossprint.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "packaged lossprint failed with exit code $LASTEXITCODE"
          }
          if ($actual -ne "lossprint $version") {
            throw "unexpected version output: $actual"
          }
      - name: Download integration fixtures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir fixtures
          for attempt in {1..12}; do
            if gh release download ci-v1 \
              --repo maxdjohnson/lossprint \
              --pattern "musdb18-hq-1.wav" \
              --pattern "musdb18-hq-1.mp3.wav" \
              --dir fixtures \
              --clobber; then
              exit 0
            fi
            if [[ "${attempt}" == 12 ]]; then
              exit 1
            fi
            sleep 5
          done
      - name: Test packaged Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          output="$("smoke/lossprint-${TARGET}/lossprint" --threshold 0.4 fixtures)"
          printf '%s\n' "${output}"
          printf '%s\n' "${output}" | awk -F '\t' '
            NF != 4 { bad = 1 }
            $2 == "clean" && $3 == "-" &&
              $4 == "fixtures/musdb18-hq-1.wav" { clean++ }
            $2 == "transcode" && $3 == "mp3" &&
              $4 == "fixtures/musdb18-hq-1.mp3.wav" { mp3++ }
            END { exit !(NR == 2 && !bad && clean == 1 && mp3 == 1) }
          '
      - name: Test packaged Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = @(& "smoke/lossprint-$env:TARGET/lossprint.exe" --threshold 0.4 fixtures)
          if ($LASTEXITCODE -ne 0) {
            throw "packaged lossprint failed with exit code $LASTEXITCODE"
          }
          $output | ForEach-Object { Write-Host $_ }

          $expected = @{
            "musdb18-hq-1.wav" = @("clean", "-")
            "musdb18-hq-1.mp3.wav" = @("transcode", "mp3")
          }
          $seen = @{}
          foreach ($line in $output) {
            $fields = $line -split "`t"
            if ($fields.Count -ne 4) {
              throw "expected four tab-separated fields: $line"
            }
            $name = [IO.Path]::GetFileName($fields[3])
            if (-not $expected.ContainsKey($name)) {
              throw "unexpected fixture in output: $name"
            }
            if ($seen.ContainsKey($name)) {
              throw "duplicate fixture in output: $name"
            }
            $verdict, $codec = $expected[$name]
            if ($fields[1] -ne $verdict -or $fields[2] -ne $codec) {
              throw "unexpected classification for ${name}: $($fields[1]) $($fields[2])"
            }
            $seen[$name] = $true
          }
          if ($seen.Count -ne $expected.Count) {
            throw "expected one result for each integration fixture"
          }
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: lossprint-${{ matrix.target }}
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - unit
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lossprint-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" \
            ./*.tar.gz ./*.zip SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
