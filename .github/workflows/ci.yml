name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Stage model
        run: python tools/fetch_model.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check library-only feature set
        run: cargo test --locked --all-targets
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run unit tests
        run: cargo test --locked --all-targets --all-features
      - name: Check API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Verify crates.io package
        shell: bash
        run: |
          set -euo pipefail
          model="model/model.onnx"
          expected_sha="33c74bde418b8330f7e67222afb2ab53706c136281bddd19ec0870b81ddce89a"

          test -z "$(git status --porcelain --untracked-files=all)"
          test -z "$(git ls-files -- '*.onnx')"
          git check-ignore -q -- "${model}"
          echo "${expected_sha}  ${model}" | sha256sum --check --strict

          # The explicit package allowlist includes the intentionally untracked
          # model, so Cargo requires --allow-dirty even though Git is clean.
          cargo package --locked --offline --allow-dirty
          version="$(cargo metadata --locked --offline --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lossprint") | .version')"
          archive="target/package/lossprint-${version}.crate"
          member="lossprint-${version}/${model}"

          tar -tzf "${archive}" | grep -Fx "${member}"
          test "$(tar -xOzf "${archive}" "${member}" | sha256sum | cut -d ' ' -f 1)" = "${expected_sha}"
          test "$(stat -c %s "${archive}")" -lt 10485760

          cargo test \
            --manifest-path "target/package/lossprint-${version}/Cargo.toml" \
            --locked \
            --offline \
            --test public_api
          cargo build \
            --manifest-path "target/package/lossprint-${version}/Cargo.toml" \
            --locked \
            --offline \
            --release \
            --features cli

  semver:
    name: Public API compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Stage model
        run: python tools/fetch_model.py
      - name: Check public API compatibility
        uses: obi1kenobi/cargo-semver-checks-action@v2
        env:
          DOCS_RS: 1
        with:
          package: lossprint
          feature-group: only-explicit-features
          # The 1.0 release intentionally reshapes the error types, relaxes
          # `MediaSource`, and makes the `audio` module private.
          # Restore `minor` immediately after publishing 1.0, or this guard
          # permits silent breakage for the whole 1.x line.
          release-type: major

  build:
    name: Build and integration test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: lossprint
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: lossprint
          - runner: macos-15
            target: aarch64-apple-darwin
            executable: lossprint
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            executable: lossprint.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - name: Stage model
        run: python tools/fetch_model.py
      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"
      - name: Build release binary
        run: cargo build --locked --release --features cli --target "${{ matrix.target }}"
      - name: Package Unix release artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          base="lossprint-${TARGET}"
          release_prefix=""
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            release_prefix="${GITHUB_REF_NAME}-"
          fi
          archive="dist/lossprint-${release_prefix}${TARGET}.tar.gz"
          mkdir -p "dist/${base}"
          install -m 755 "target/${TARGET}/release/lossprint" "dist/${base}/lossprint"
          install -m 644 README.md LICENSE THIRD_PARTY.md Cargo.lock "dist/${base}/"
          tar -C dist -czf "${archive}" "${base}"
          echo "ARCHIVE_PATH=${archive}" >> "${GITHUB_ENV}"
      - name: Package Windows release artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "lossprint-$env:TARGET"
          $releasePrefix = ""
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $releasePrefix = "$env:GITHUB_REF_NAME-"
          }
          $archive = "dist/lossprint-$releasePrefix$env:TARGET.zip"
          $stage = "dist/$base"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/$env:TARGET/release/lossprint.exe" "$stage/lossprint.exe"
          Copy-Item README.md, LICENSE, THIRD_PARTY.md, Cargo.lock -Destination $stage
          Compress-Archive -LiteralPath $stage -DestinationPath $archive
          "ARCHIVE_PATH=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Extract packaged Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir smoke
          tar -xzf "${ARCHIVE_PATH}" -C smoke
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lossprint") | .version')"
          "smoke/lossprint-${TARGET}/lossprint" --version | grep -Fx "lossprint ${version}"
      - name: Extract packaged Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive -LiteralPath $env:ARCHIVE_PATH -DestinationPath smoke
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "cargo metadata failed with exit code $LASTEXITCODE"
          }
          $version = ($metadata.packages | Where-Object name -eq "lossprint").version
          $actual = & "smoke/lossprint-$env:TARGET/lossprint.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "packaged lossprint failed with exit code $LASTEXITCODE"
          }
          if ($actual -ne "lossprint $version") {
            throw "unexpected version output: $actual"
          }
      - name: Test packaged artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/cli.py "smoke/lossprint-${{ matrix.target }}/${{ matrix.executable }}"
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: lossprint-${{ matrix.target }}
          path: ${{ env.ARCHIVE_PATH }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - unit
      - semver
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lossprint-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" \
            ./*.tar.gz ./*.zip SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
