name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo test --locked

  build:
    name: Build and integration test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust target
        run: rustup target add "$TARGET"
      - name: Build release binary
        run: cargo build --locked --release --target "$TARGET"
      - name: Package release artifact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          base="lossprint-${TARGET}"
          release_prefix=""
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            release_prefix="${GITHUB_REF_NAME}-"
          fi
          archive="dist/lossprint-${release_prefix}${TARGET}.tar.gz"
          mkdir -p "dist/${base}"
          install -m 755 "target/${TARGET}/release/lossprint" "dist/${base}/lossprint"
          install -m 644 README.md LICENSE THIRD_PARTY.md "dist/${base}/"
          tar -C dist -czf "${archive}" "${base}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
      - name: Extract packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir smoke
          tar -xzf "${{ steps.package.outputs.archive }}" -C smoke
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lossprint") | .version')"
          "smoke/lossprint-${TARGET}/lossprint" --version | grep -Fx "lossprint ${version}"
      - name: Download integration fixtures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir fixtures
          for attempt in {1..12}; do
            if gh release download ci-v1 \
              --repo maxdjohnson/lossprint \
              --pattern "musdb18-hq-1.wav" \
              --pattern "musdb18-hq-1.mp3.wav" \
              --dir fixtures \
              --clobber; then
              exit 0
            fi
            if [[ "${attempt}" == 12 ]]; then
              exit 1
            fi
            sleep 5
          done
      - name: Test packaged artifact
        shell: bash
        run: |
          set -euo pipefail
          output="$("smoke/lossprint-${TARGET}/lossprint" --threshold 0.4 fixtures)"
          printf '%s\n' "${output}"
          printf '%s\n' "${output}" | awk -F '\t' '
            NF != 4 { bad = 1 }
            $2 == "clean" && $3 == "-" &&
              $4 == "fixtures/musdb18-hq-1.wav" { clean++ }
            $2 == "transcode" && $3 == "mp3" &&
              $4 == "fixtures/musdb18-hq-1.mp3.wav" { mp3++ }
            END { exit !(NR == 2 && !bad && clean == 1 && mp3 == 1) }
          '
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: lossprint-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - unit
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: lossprint-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" \
            ./*.tar.gz SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
